[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trace-scrub"
version = "0.1.0"
description = "Redact sensitive values from LLM traces, prompts, and JSONL logs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mert Efe Kurt" }]
keywords = ["llm", "privacy", "redaction", "automation", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
trace-scrub = "trace_scrub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_scrub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
